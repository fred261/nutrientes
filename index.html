<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>brpetrus.com.br</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --card-bg: #ffffff;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --accent: #2f7a3d;
    --accent-hover: #256231;
    --border: #e2e2e0;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181a;
      --card-bg: #212426;
      --text: #f2f2f2;
      --muted: #9a9a9a;
      --accent: #4caf5f;
      --accent-hover: #5fc271;
      --border: #33373a;
      --error: #ff6b60;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 360px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 4px;
    text-align: center;
  }
  p.sub {
    margin: 0 0 24px;
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  form { display: flex; flex-direction: column; gap: 14px; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  button {
    padding: 12px 14px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: var(--accent-hover); }
  .error {
    color: var(--error);
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
    margin: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Acesso restrito</h1>
    <p class="sub">Digite a senha da sua empresa para continuar</p>
    <form id="gate-form" autocomplete="off">
      <input type="password" id="password" name="password" placeholder="Senha" required autofocus>
      <button type="submit">Entrar</button>
      <p class="error" id="error-msg"></p>
    </form>
  </div>

<script>
  // Mapa senha (hash SHA-256) -> { destino, chave de sessão liberada }
  // Nunca armazenamos a senha em texto puro no código-fonte.
  const ACCESS_MAP = {
    "7f5b1ff615a554c8e5348dc25e35570a7a9b2de5c1e0db875b268eea4e634963": {
      grant: "access_nutrientes",
      redirect: "/nutrientes/"
    }
    // Para adicionar uma nova empresa: gere o hash SHA-256 da senha dela
    // e acrescente uma nova entrada aqui, com sua própria pasta/redirect.
  };

  async function sha256Hex(text) {
    const data = new TextEncoder().encode(text);
    const hashBuffer = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hashBuffer))
      .map(b => b.toString(16).padStart(2, "0"))
      .join("");
  }

  const form = document.getElementById("gate-form");
  const errorMsg = document.getElementById("error-msg");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.textContent = "";
    const value = document.getElementById("password").value;
    const hash = await sha256Hex(value);
    const match = ACCESS_MAP[hash];
    if (match) {
      sessionStorage.setItem(match.grant, "granted");
      window.location.href = match.redirect;
    } else {
      errorMsg.textContent = "Senha incorreta.";
    }
  });
</script>
</body>
</html>
